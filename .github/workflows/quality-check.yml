name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  site-health:
    name: 사이트 접속 확인
    runs-on: ubuntu-latest
    steps:
      - name: pro-dashboards.com 접속
        run: |
          curl -f --max-time 15 --retry 3 --retry-delay 5 \
            -o /dev/null -s -w "HTTP %{http_code}\n" \
            https://pro-dashboards.com
          echo "✅ pro-dashboards.com 정상"

  verify:
    name: ESLint·테스트(npm run verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run verify
